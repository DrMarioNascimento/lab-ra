<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planta da torre · LAB-RA</title><style>body{background:#071019;color:#edf5f5;font:16px system-ui;margin:20px}a{color:#8ee4c7}#planta{max-width:420px;margin:auto}.andar rect{fill:#132838;stroke:#335164}.andar text{fill:#d0eaf2;font:10px system-ui}.torre-poco{stroke:#c68f65;stroke-width:3}.torre-rota{fill:none;stroke:#efc878;stroke-width:2}.andar{cursor:pointer}.andar:hover rect{fill:#385667}#descricao{max-width:650px;margin:auto}</style><a href="../../../../../bancadas.html#dragon">← Biblioteca</a><h1>Planta da Torre de Continuidade</h1><div id="planta"></div><p id="descricao">Toque num andar para consultar as salas.</p><script src="dados.js"></script><script>var D=VC_DADOS,NIV=D.geo.andares.map(a=>a.a),LACRADOS={'+9':1,'+7':1,'+6':1},rotaRevelada=true;function iDe(a){return NIV.indexOf(a)}function yDe(i){return 30+i*34}function andarDoJogador(){return null}</script><script src="planta-original.js"></script><script>document.getElementById('planta').innerHTML=plantaSVG();document.querySelectorAll('.andar').forEach(g=>g.onclick=()=>{const a=D.geo.andares.find(a=>a.a===g.dataset.andar);document.getElementById('descricao').innerHTML='<b>'+a.a+' — '+a.nome+'</b><br>'+a.salas.map(s=>s.n+': '+s.d).join('<br>');});</script></html>
