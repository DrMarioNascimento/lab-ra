<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modelo · LAB-RA</title><style>body{margin:0;background:#071019;color:#eee;font:16px system-ui}header{position:fixed;z-index:20;top:0;left:0;right:0;background:#071019dd;padding:14px 20px;display:flex;gap:25px;align-items:center}a{color:#8ee4c7}#modelo{position:fixed;inset:0;height:100svh}canvas{display:block;width:100%;height:100%}.peca3d-ui{position:absolute;bottom:18px;left:18px;display:flex;gap:8px}.p3-btn{padding:10px;border:1px solid #56877a;background:#0d211e;color:white;border-radius:10px}[data-p3="esquema"]{display:none}#status{position:absolute;left:20px;top:80px}h1{font-size:16px;font-weight:500}</style><header><a href="../../bancadas.html#dragon">← Biblioteca</a><h1 id="nome">Modelo</h1></header><div id="modelo"><span id="status">Carregando…</span></div><script src="jogos/o-eco-do-amanha/o-impostor/peca3d.js"></script><script>fetch('modelos-estudo.json').then(r=>r.json()).then(map=>{const m=map[new URLSearchParams(location.search).get('id')];if(!m)throw Error('Modelo não encontrado');document.getElementById('nome').textContent=m.nome;return VCPeca3D.abrir(document.getElementById('modelo'),{glb:m.glb,nome:m.nome,vista:()=>[[3.2,2.1,3.2],[0,.9,0]]}).then(()=>{const T=window.THREE;let obj=Object.values(VCPeca3D.nos())[0];if(!obj)throw Error('Modelo vazio');while(obj.parent&&obj.parent.name!=='raiz-peca')obj=obj.parent;obj.updateMatrixWorld(true);let box=new T.Box3().setFromObject(obj),size=box.getSize(new T.Vector3());obj.scale.multiplyScalar(2.5/Math.max(size.x,size.y,size.z,.001));obj.updateMatrixWorld(true);box=new T.Box3().setFromObject(obj);const center=box.getCenter(new T.Vector3());obj.position.sub(new T.Vector3(center.x,box.min.y,center.z));if(obj.userData.base3d)obj.userData.base3d.p.copy(obj.position);obj.updateMatrixWorld(true);VCPeca3D.atualizar({etapa:0,vistos:{}});document.getElementById('status').hidden=true;});}).catch(e=>document.getElementById('status').textContent=e.message);</script></html>
