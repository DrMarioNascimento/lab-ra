name: Auditar RA do Bonde
on:
  push:
    branches: [main, codex/corrigir-ra-bonde-20261107]
    paths: ['dilema-bonde-3d/**', 'tests/bonde-ra.test.mjs', '.github/workflows/bonde-ra.yml']
  pull_request:
    paths: ['dilema-bonde-3d/**', 'tests/bonde-ra.test.mjs', '.github/workflows/bonde-ra.yml']
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install usd-core==26.11
      # Migração única do arquivo binário na branch de reparo. Nunca escreve em main.
      - name: Normalizar arquivo nativo existente
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/corrigir-ra-bonde-20261107'
        run: |
          python dilema-bonde-3d/tests/validar-usdz.py --corrigir-tipos
          if ! git diff --quiet -- dilema-bonde-3d/ar/maquete.usdz; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add dilema-bonde-3d/ar/maquete.usdz
            git commit -m "Corrige tipos USD dos materiais da maquete nativa"
            git push origin HEAD:codex/corrigir-ra-bonde-20261107
          fi
      - run: npm test
      - run: python dilema-bonde-3d/tests/validar-usdz.py
