name: Auditar RA do Bonde
on:
  push:
    branches: [main, codex/bonde-placas-fantasmas-ra12]
    paths: ['dilema-bonde-3d/**', 'tests/bonde-*.test.mjs', '.github/workflows/bonde-ra.yml']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['dilema-bonde-3d/**', 'tests/bonde-*.test.mjs', '.github/workflows/bonde-ra.yml']
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install usd-core==26.11
      - run: npx playwright install --with-deps chromium
      - name: Otimizar vegetação a partir dos originais
        run: node dilema-bonde-3d/scripts/otimizar-vegetacao.mjs
      - run: npm test
      - name: Navegação real no PC e interface móvel
        env:
          BONDE_CAPTURAS: qa-ra12
        run: node dilema-bonde-3d/tests/navegacao-pc.mjs
      # Reproduz a atualização binária na branch de trabalho; nunca escreve em main.
      - name: Reconstruir maquete e vegetação RA12
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/bonde-placas-fantasmas-ra12'
        run: |
          node dilema-bonde-3d/scripts/gerar-usdz.mjs
          python dilema-bonde-3d/tests/validar-usdz.py
          git add dilema-bonde-3d/ar/maquete.usdz dilema-bonde-3d/assets/*_mobile.glb dilema-bonde-3d/assets/*_economica.glb
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add dilema-bonde-3d/ar/maquete.usdz dilema-bonde-3d/assets/*_mobile.glb dilema-bonde-3d/assets/*_economica.glb
            git commit -m "Reconstrói USDZ RA12 e vegetação otimizada"
            git push origin HEAD:codex/bonde-placas-fantasmas-ra12
          fi
      - run: python dilema-bonde-3d/tests/validar-usdz.py
