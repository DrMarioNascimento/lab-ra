name: Auditar RA do Bonde
on:
  push:
    branches: [main, codex/bonde-gestos-araucarias-20261107]
    paths: ['dilema-bonde-3d/**', 'tests/bonde-*.test.mjs', '.github/workflows/bonde-ra.yml']
  pull_request:
    paths: ['dilema-bonde-3d/**', 'tests/bonde-*.test.mjs', '.github/workflows/bonde-ra.yml']
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install usd-core==26.11
      # Reproduz a atualização binária na branch de trabalho; nunca escreve em main.
      - name: Restaurar duas araucárias no arquivo nativo
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/bonde-gestos-araucarias-20261107'
        run: |
          node dilema-bonde-3d/scripts/araucarias-usdz.mjs /tmp/bonde-araucarias
          python dilema-bonde-3d/scripts/inserir-araucarias-usdz.py /tmp/bonde-araucarias
          python dilema-bonde-3d/tests/validar-usdz.py
          if ! git diff --quiet -- dilema-bonde-3d/ar/maquete.usdz; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add dilema-bonde-3d/ar/maquete.usdz
            git commit -m "Restaura duas araucárias fora dos trilhos no USDZ nativo"
            git push origin HEAD:codex/bonde-gestos-araucarias-20261107
          fi
      - run: npm test
      - run: python dilema-bonde-3d/tests/validar-usdz.py
