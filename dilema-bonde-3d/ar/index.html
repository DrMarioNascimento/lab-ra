<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dilema do Bonde — Realidade Aumentada</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Nunito', system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  #cena { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #overlay { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #overlay > * { pointer-events: auto; }
  #inicio { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: #16223a; color: #f5ecd6; text-align: center; padding: 24px; }
  #inicio button { margin-top: 18px; height: 56px; padding: 0 30px; border-radius: 999px; border: 0; font: 800 18px 'Nunito'; color: #fff; background: linear-gradient(#e0473a, #b22a20); box-shadow: 0 5px 0 #7a1a12, 0 10px 20px rgba(0,0,0,.35); }
  #inicio button:active { transform: translateY(4px); box-shadow: 0 1px 0 #7a1a12; }
  #inicio a { color: #f5c97a; }
  .barra { position: fixed; left: 0; right: 0; bottom: max(10px, env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: center; padding: 0 12px; gap: 8px; }
  .pill { height: 52px; border-radius: 999px; border: 0; font: 800 15px 'Nunito'; padding: 0 18px; color: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.3), 0 8px 18px rgba(0,0,0,.3); }
  .pill:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.3); }
  .pill.ativo { outline: 3px solid #fff; outline-offset: 2px; }
  .pill:disabled { filter: grayscale(.7) brightness(.85); }
  #manter { background: linear-gradient(#3f7fd1, #2a5fa8); }
  #desviar { background: linear-gradient(#e39a2b, #c27412); }
  .centro { display: flex; gap: 8px; background: rgba(255,255,255,.92); border-radius: 999px; padding: 6px 8px; box-shadow: 0 5px 0 rgba(0,0,0,.2); }
  .ico { width: 42px; height: 42px; border-radius: 50%; border: 0; background: linear-gradient(#f4f6fa, #dfe4ec); box-shadow: 0 3px 0 #b9c1cf; font-size: 18px; color: #2b3445; }
  .ico:active { transform: translateY(3px); box-shadow: none; }
  #crono { min-width: 54px; height: 42px; border-radius: 999px; display: grid; place-items: center; font-weight: 800; color: #2b3445; border: 2px solid #2b3445; box-sizing: border-box; padding: 0 6px; }
  #aviso { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); background: rgba(255,255,255,.92); color: #2b3445; padding: 8px 16px; border-radius: 999px; font-weight: 800; font-size: 14px; text-align: center; max-width: 88vw; }
  #colocar { position: fixed; right: 12px; top: max(60px, calc(env(safe-area-inset-top) + 50px)); height: 44px; padding: 0 16px; border-radius: 999px; border: 0; font: 800 14px 'Nunito'; color: #2b3445; background: linear-gradient(#ffffff, #e3e8f0); box-shadow: 0 4px 0 #b9c1cf; display: none; }
  #colocar:active { transform: translateY(3px); box-shadow: none; }
</style>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }</script>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="cena"></canvas>
<div id="inicio"><div>
  <h2 style="margin:0 0 8px">Dilema do Bonde em RA</h2>
  <div>Sem marcador: a maquete aparece onde você apontar a câmera.<br>Use em pé, apontando para a mesa ou o chão.</div>
  <button id="comecar">Abrir câmera</button>
  <div style="margin-top:14px;font-size:14px"><a href="../index.html">Ver sem RA</a></div>
</div></div>
<div id="overlay">
  <div id="aviso">Toque em "Abrir câmera"</div>
  <button id="colocar">📍 Recolocar aqui</button>
  <div class="barra">
    <button id="manter" class="pill ativo">Manter o curso</button>
    <div class="centro"><button class="ico" id="play">▶</button><div id="crono">10</div><button class="ico" id="reset">↺</button></div>
    <button id="desviar" class="pill">Desviar o bonde</button>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { criarMaquete } from '../js/cena.js';

const aviso = document.getElementById('aviso');
const status = t => { aviso.textContent = t; };
const mostraErro = e => { const msg = (e && (e.message || e.reason?.message || e.reason)) || String(e); status('⚠ ' + msg); console.error(e); };
addEventListener('error', mostraErro); addEventListener('unhandledrejection', mostraErro);

const LARGURA_REAL = 0.8;                 // a maquete (160 m) vira ~80 cm sobre a mesa
const ESC_BASE = LARGURA_REAL / 160;

const canvas = document.getElementById('cena');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xf2f6ff, 0x6a7a50, 2.0));
const sol = new THREE.DirectionalLight(0xfff1dc, 2.6); sol.position.set(-0.6, 1.2, 0.8); scene.add(sol);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.02, 50);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

const ancora = new THREE.Group(); ancora.visible = false; scene.add(ancora);   // ponto onde a maquete fica "presa"
const base = new THREE.Group(); base.scale.setScalar(ESC_BASE); ancora.add(base);
let m = null;

// ---------- controles do dilema (iguais à versão de tela) ----------
const bM = document.getElementById('manter'), bD = document.getElementById('desviar'), crono = document.getElementById('crono');
let tempo = 10, contando = false, acum = 0;
const sinc = () => { if (!m) return; bM.classList.toggle('ativo', m.rota === 'principal'); bD.classList.toggle('ativo', m.rota === 'ramal'); };
const escolher = r => { if (!m) return; if (m.definirRota(r)) sinc(); else if (m.estado.travado) status('O bonde já passou pela agulha — a decisão está tomada'); };
bM.onclick = () => escolher('principal'); bD.onclick = () => escolher('ramal');
document.getElementById('play').onclick = () => { if (m && !contando && !m.estado.rodando) { contando = true; status('O bonde vai partir da estação… decida antes da agulha'); } };
document.getElementById('reset').onclick = () => { if (!m) return; m.reiniciar(); m.sortearPersonagens(); tempo = 10; contando = false; crono.textContent = '10'; [bM, bD].forEach(b => b.disabled = false); sinc(); };
const ray = new THREE.Raycaster();
function tocarAlavanca(origem, direcao) { if (!m) return false; ray.set(origem, direcao); if (ray.intersectObject(m.alvoToque, false).length) { if (m.alternarAlavanca()) sinc(); return true; } return false; }

async function carregarMaquete() {
  m = await criarMaquete({ grupos: { presetPrincipal: 'trabalhador', nPrincipal: 1, presetRamal: 'desconhecidos', nRamal: 3 }, progresso: t => status(t) });
  m.root.traverse(o => { if (o.isMesh) { o.castShadow = false; o.receiveShadow = false; } if (o.isLight) o.visible = false; });
  base.add(m.root);
  m.estado.aoImpacto = r => status(r === 'principal' ? 'O bonde seguiu pelo trilho principal' : 'O bonde foi desviado para o ramal');
  m.estado.aoFim = () => status(aviso.textContent + ' — o bonde voltou à estação. Toque ↺ para nova rodada');
}
function passo(dt) {
  if (!m) return;
  if (contando) { acum += dt; if (acum >= 1) { acum = 0; tempo--; crono.textContent = String(Math.max(0, tempo)); if (tempo <= 0) { contando = false; m.partir(); } } }
  if (m.estado.travado) [bM, bD].forEach(b => b.disabled = true);
  m.update(dt);
}

// =====================================================================
// MODO 1 — WebXR (Android/Chrome): detecta a superfície real
// =====================================================================
async function iniciarWebXR() {
  renderer.xr.enabled = true;
  const sessao = await navigator.xr.requestSession('immersive-ar', { requiredFeatures: ['hit-test'], optionalFeatures: ['dom-overlay'], domOverlay: { root: document.getElementById('overlay') } });
  renderer.xr.setReferenceSpaceType('local'); await renderer.xr.setSession(sessao);
  const espacoVisor = await sessao.requestReferenceSpace('viewer');
  const fonteHit = await sessao.requestHitTestSource({ space: espacoVisor });
  const mira = new THREE.Mesh(new THREE.RingGeometry(0.06, 0.08, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  mira.matrixAutoUpdate = false; mira.visible = false; scene.add(mira);
  status('Carregando a maquete…'); await carregarMaquete();
  status('Aponte para a mesa ou o chão e toque quando o círculo aparecer');
  let colocada = false;
  const ctrl = renderer.xr.getController(0); scene.add(ctrl);
  ctrl.addEventListener('select', () => {
    if (!colocada || document.getElementById('colocar').dataset.recolocar === '1') {
      if (!mira.visible) return;
      ancora.position.setFromMatrixPosition(mira.matrix); const cam = renderer.xr.getCamera();
      ancora.rotation.set(0, Math.atan2(cam.position.x - ancora.position.x, cam.position.z - ancora.position.z), 0);
      ancora.visible = true; colocada = true; document.getElementById('colocar').dataset.recolocar = '0'; mira.visible = false;
      document.getElementById('colocar').style.display = 'block';
      status('Toque na alavanca ou nos botões para escolher o trilho'); return;
    }
    const o = new THREE.Vector3().setFromMatrixPosition(ctrl.matrixWorld), d = new THREE.Vector3(0, 0, -1).applyQuaternion(new THREE.Quaternion().setFromRotationMatrix(ctrl.matrixWorld));
    tocarAlavanca(o, d);
  });
  document.getElementById('colocar').onclick = e => { e.stopPropagation(); document.getElementById('colocar').dataset.recolocar = '1'; status('Aponte para a superfície e toque para recolocar'); };
  const relogio = new THREE.Clock();
  renderer.setAnimationLoop((t, frame) => {
    const dt = Math.min(0.05, relogio.getDelta());
    if (frame && (!colocada || document.getElementById('colocar').dataset.recolocar === '1')) {
      const hits = frame.getHitTestResults(fonteHit);
      if (hits.length) { const pose = hits[0].getPose(renderer.xr.getReferenceSpace()); mira.visible = true; mira.matrix.fromArray(pose.transform.matrix); } else mira.visible = false;
    }
    passo(dt); renderer.render(scene, camera);
  });
}

// =====================================================================
// MODO 2 — iPhone/Safari: câmera + giroscópio (a maquete fica na direção escolhida)
// =====================================================================
const zee = new THREE.Vector3(0, 0, 1), euler = new THREE.Euler(), q0 = new THREE.Quaternion(), q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
let orient = null, ajusteYaw = 0;
function quatDoAparelho(alvo) {
  if (!orient || orient.alpha == null) return false;
  const a = THREE.MathUtils.degToRad(orient.alpha), b = THREE.MathUtils.degToRad(orient.beta), g = THREE.MathUtils.degToRad(orient.gamma);
  const tela = THREE.MathUtils.degToRad((screen.orientation && screen.orientation.angle) || window.orientation || 0);
  euler.set(b, a, -g, 'YXZ'); alvo.setFromEuler(euler); alvo.multiply(q1); alvo.multiply(q0.setFromAxisAngle(zee, -tela));
  return true;
}
async function iniciarGiroscopio() {
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    let r = 'denied'; try { r = await DeviceOrientationEvent.requestPermission(); } catch (e) {} if (r !== 'granted') status('Sem acesso ao movimento do aparelho: a maquete fica fixa na tela (recarregue e toque em Permitir).');
  }
  addEventListener('deviceorientation', e => { orient = e; });
  status('Abrindo a câmera…');
  const video = document.getElementById('video');
  video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  video.style.display = 'block'; await video.play();
  status('Carregando a maquete…'); await carregarMaquete();
  // ajuste de campo de visão aproximado da câmera traseira
  const ajustarFov = () => { camera.fov = innerWidth > innerHeight ? 48 : 66; camera.updateProjectionMatrix(); }; ajustarFov(); addEventListener('resize', ajustarFov);
  const ALTURA = 1.2;                       // celular ~1,2 m acima da superfície
  let dist = 1.6, girar = 0, escala = 1;
  const colocar = () => {               // põe a maquete à frente, na direção em que a câmera aponta (no plano do chão)
    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion); dir.y = 0; if (dir.lengthSq() < 1e-4) dir.set(0, 0, -1); dir.normalize();
    ancora.position.set(dir.x * dist, -ALTURA, dir.z * dist); ancora.rotation.set(0, Math.atan2(-dir.x, -dir.z) + girar, 0); ancora.visible = true;
  };
  const btn = document.getElementById('colocar'); btn.style.display = 'block';
  btn.onclick = () => { colocar(); status('Toque na alavanca ou nos botões. Arraste para girar, pinça para aproximar/afastar'); };
  // gestos: arrastar = girar a maquete; pinça = aproximar/afastar; toque curto = alavanca
  const toques = new Map(); let t0 = null, d0 = null, dist0 = dist, giro0 = 0;
  canvas.addEventListener('pointerdown', e => { toques.set(e.pointerId, [e.clientX, e.clientY]); t0 = [e.clientX, e.clientY, performance.now()]; if (toques.size === 2) { const [p, q] = [...toques.values()]; d0 = Math.hypot(p[0] - q[0], p[1] - q[1]); dist0 = dist; } giro0 = girar; });
  canvas.addEventListener('pointermove', e => {
    if (!toques.has(e.pointerId)) return; toques.set(e.pointerId, [e.clientX, e.clientY]);
    if (toques.size === 2 && d0) { const [p, q] = [...toques.values()]; dist = THREE.MathUtils.clamp(dist0 * d0 / Math.hypot(p[0] - q[0], p[1] - q[1]), 0.5, 4); const y = ancora.rotation.y, dd = new THREE.Vector3(ancora.position.x, 0, ancora.position.z).normalize(); ancora.position.set(dd.x * dist, -ALTURA, dd.z * dist); ancora.rotation.y = y; }
    else if (toques.size === 1 && t0) { const dx = e.clientX - t0[0]; const novo = giro0 + dx * 0.01; ancora.rotation.y += novo - girar; girar = novo; }
  });
  const fim = e => {
    if (toques.size === 1 && t0 && Math.hypot(e.clientX - t0[0], e.clientY - t0[1]) < 8 && performance.now() - t0[2] < 400) {
      const p = new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(p, camera);
      if (m && ray.intersectObject(m.alvoToque, false).length && m.alternarAlavanca()) sinc();
    }
    toques.delete(e.pointerId); if (toques.size < 2) d0 = null;
  };
  canvas.addEventListener('pointerup', fim); canvas.addEventListener('pointercancel', fim);
  // espera a primeira leitura do giroscópio para colocar a maquete à frente
  let colocadaUmaVez = false;
  const relogio = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(0.05, relogio.getDelta());
    if (quatDoAparelho(camera.quaternion)) { if (!colocadaUmaVez) { colocar(); colocadaUmaVez = true; status('Toque na alavanca ou nos botões. Arraste para girar, pinça para aproximar/afastar'); } }
    else if (!colocadaUmaVez && relogio.elapsedTime > 2.5) { status('Sem giroscópio: a maquete fica fixa à frente'); colocar(); colocadaUmaVez = true; }
    passo(dt); renderer.render(scene, camera);
  });
}

// =====================================================================
// iPhone/iPad: RA NATIVA (AR Quick Look) — tela cheia, apoiada na mesa, pinça e arraste do iOS,
// com as placas "Manter o curso", "Desviar o bonde" e "Reiniciar" na mesa (mesmo recurso do músculo-sarcômero)
// =====================================================================
const ehIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (ehIOS || new URLSearchParams(location.search).has('quicklook')) {
  // MESMO ESQUEMA DAS OUTRAS RA DO LAB-RA (ex.: A Casa da Costa): link <a rel="ar"> VISÍVEL,
  // tocado diretamente, apontando para um .usdz pronto no servidor.
  const card = document.querySelector('#inicio > div');
  card.innerHTML = `<h2 style="margin:0 0 8px">Dilema do Bonde em RA</h2>
    <a id="linkAR" rel="ar" href="maquete.usdz" style="display:inline-flex;flex-direction:column;align-items:center;gap:10px;padding:14px 16px;border-radius:18px;background:linear-gradient(#e0473a,#b22a20);box-shadow:0 5px 0 #7a1a12,0 10px 20px rgba(0,0,0,.35);color:#fff;text-decoration:none;font:800 17px Nunito,system-ui">
      <img src="maquete-ar.jpg" alt="Maquete do Dilema do Bonde" style="width:220px;border-radius:12px;pointer-events:none">Toque para abrir na câmera</a>
    <p id="statusAR" style="margin:14px 0 0">Aponte para a mesa ou o chão. Na mesa aparecem as placas <b>Manter o curso</b>, <b>Desviar o bonde</b> e <b>Reiniciar</b> — toque nelas. Pinça aproxima; arraste muda de lugar.</p>
    <p style="margin:10px 0 0;font-size:14px"><small id="paresAR">Nesta versão: 1 trabalhador no trilho principal; 3 desconhecidos no ramal.</small></p>
    <button id="trocarAR" style="margin-top:12px;height:48px;padding:0 22px;border-radius:999px;border:0;font:800 15px Nunito,system-ui;color:#fff;background:linear-gradient(#5b6b82,#3d4a5c);box-shadow:0 5px 0 #26303d">Trocar personagens</button>
    <div style="margin-top:14px;font-size:14px"><a href="../index.html" style="color:#f5c97a">Ver sem RA</a></div>`;
  document.getElementById('overlay').style.display = 'none';
  const a = document.getElementById('linkAR'), st = document.getElementById('statusAR'), bt = document.getElementById('trocarAR');
  let suporta = false; try { suporta = !!(a.relList && a.relList.supports && a.relList.supports('ar')); } catch (e) {}
  if (!suporta) { a.removeAttribute('rel'); st.textContent = 'Este aparelho não abre a RA do iPhone. Use o Safari (não um app interno) e toque de novo.'; }
  const PAPEIS = ['trabalhador', 'idoso', 'gestante', 'criancas', 'estudante', 'cientista', 'colega', 'vinculo', 'desconhecidos'];
  const NOME = { trabalhador: 'trabalhador', idoso: 'idoso', gestante: 'gestante', criancas: 'criança', estudante: 'estudante', cientista: 'cientista', colega: 'colega de turma', vinculo: 'vínculo afetivo', desconhecidos: 'desconhecidos' };
  let url = null;
  // outros personagens: o iPhone monta um novo arquivo; o mesmo link passa a abri-lo
  bt.onclick = async () => {
    bt.disabled = true; bt.textContent = 'Montando…';
    try {
      const pool = [...PAPEIS], p1 = pool.splice(Math.floor(Math.random() * pool.length), 1)[0], p3 = pool[Math.floor(Math.random() * pool.length)];
      const { criarMaquete: cm } = await import('../js/cena.js?v=' + Date.now());
      const { montarUSDZ } = await import('./quicklook.js');
      const m = await cm({ grupos: { presetPrincipal: p1, nPrincipal: 1, presetRamal: p3, nRamal: 3 }, ra: true });
      const { usdz } = await montarUSDZ(m);
      if (url) URL.revokeObjectURL(url); url = URL.createObjectURL(new Blob([usdz], { type: 'model/vnd.usdz+zip' }));
      a.href = url; document.getElementById('paresAR').textContent = `Nesta versão: 1 ${NOME[p1]} no trilho principal; 3 (${NOME[p3]}) no ramal.`;
    } catch (e) { console.error(e); st.textContent = 'Não deu para montar outros personagens neste aparelho; o link abre a versão padrão.'; a.href = 'maquete.usdz'; }
    bt.disabled = false; bt.textContent = 'Trocar personagens';
  };
} else
document.getElementById('comecar').onclick = async () => {
  document.getElementById('inicio').remove();
  try {
    const temXR = navigator.xr && await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
    if (temXR) await iniciarWebXR(); else await iniciarGiroscopio();
  } catch (e) { mostraErro(e); }
};
</script>
</body>
</html>
