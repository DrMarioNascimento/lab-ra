      hitSource=null;
      placed=false;
      reticle.visible=false;
      model.position.set(0,0,0);
      model.scale.setScalar(1);
      model.visible=true;
      renderer.setClearAlpha(1);
      renderer.shadowMap.enabled=true;
      arButton.disabled=false;
      arMessage('Para reposicionar a maquete, abra a RA novamente.');
    },{once:true});
    await renderer.xr.setSession(session);
    renderer.setClearAlpha(0);
    renderer.shadowMap.enabled=false;
    model.visible=false;
    const viewer=await session.requestReferenceSpace('viewer');
    const source=await session.requestHitTestSource({space:viewer});
    if(renderer.xr.getSession()!==session){
      source.cancel();
      return;
    }
    hitSource=source;
    session.addEventListener('select',()=>{
      if(!reticle.visible||placed)return;
      model.position.copy(reticle.position);
      model.scale.setScalar(.008);
      model.visible=true;
      reticle.visible=false;
      distance=9;
      placed=true;
    });
  }catch(error){
    if(session&&renderer.xr.getSession()===session)await session.end().catch(()=>{});
    arButton.disabled=false;
    arMessage('A sessão de RA não abriu. Você pode continuar na vista 3D.');
    console.error(error);
  }
}
if(navigator.xr){
  navigator.xr.isSessionSupported('immersive-ar').then(supported=>{
    if(!supported)return;
    arButton.hidden=false;
    arButton.onclick=openAR;
    arMessage('Em RA, aponte para a mesa e toque quando o círculo azul aparecer.');
  }).catch(()=>{});
}
function frame(now,xrFrame){
  if(xrFrame&&hitSource&&!placed){
    const hit=xrFrame.getHitTestResults(hitSource)[0];
    const pose=hit?.getPose(renderer.xr.getReferenceSpace());
    reticle.visible=Boolean(pose);
    if(pose){
      const {x,y,z}=pose.transform.position;
      reticle.position.set(x,y+.002,z);
    }
  }
  if((renderer.xr.isPresenting?placed:playing)&&last!==undefined) distance=(distance+Math.min((now-last)/1000,.05)*5.7*rate)%length;
  last=now;
  const nextDistance=(distance+.03)%length;
  const [x,z]=carRoute(distance,activeBranch),[nx,nz]=carRoute(nextDistance,activeBranch);
  const y=trackHeight(distance);
  const tangent=new T.Vector3(nx-x,trackHeight(nextDistance)-y,nz-z).normalize();
  car.position.set(x,y+.04,z);
  car.rotation.set(0,Math.atan2(-tangent.z,tangent.x),Math.asin(tangent.y),'YXZ');
  for(const wheel of wheels)wheel.rotation.z=-distance/.27;
  const label=distance<2*straight?'Primeiro plano · saída pela direita':distance<2*straight+arc?'Curva · fora do enquadramento':distance<4*straight+arc?'Retorno elevado · passagem pela estação':'Curva · retorno ao primeiro plano';
  if(get('phase').textContent!==label)get('phase').textContent=label;
  renderer.render(scene,camera);

}
function syncPlay(){get('play').textContent=playing?'Pausar':'Reproduzir';}
get('play').onclick=()=>{playing=!playing;syncPlay();};
get('reset').onclick=()=>{distance=9;};
get('slow').onclick=()=>{rate=rate===1?.5:1;get('slow').setAttribute('aria-pressed',String(rate===.5));};
get('view').onclick=()=>{elevated=!elevated;get('view').setAttribute('aria-pressed',String(elevated));resize();};
syncPlay();
for(const button of document.querySelectorAll('nav button'))button.disabled=false;
get('fallback').remove();
renderer.setAnimationLoop(frame);
} catch(error) {
  get('fallback').textContent='Não foi possível abrir a cena. Confira a conexão e o suporte a WebGL no navegador.';
  console.error(error);
}
</script>
