<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dilema do Bonde 3D · Lab‑RA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eaf0f5;color:#203247;font:16px system-ui}main{max-width:1440px;margin:auto;padding:clamp(12px,3vw,38px)}h1{margin:.2em 0}small{letter-spacing:.1em;font-weight:700}p{margin:.5em 0 1em}#stage{aspect-ratio:2.2;position:relative;border-radius:16px;overflow:hidden;background:#dbe5ed}canvas{display:block;width:100%;height:100%}nav{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}button{font:inherit;background:#204c80;color:white;border:1px solid #6593bb;border-radius:10px;padding:9px 14px;box-shadow:0 3px #133351;cursor:pointer}button:active{transform:translateY(2px)}#fallback{padding:20px}button:disabled{opacity:.5}
</style>
<main>
<small>LAB‑RA · EXPERIMENTO</small><h1>Dilema do Bonde em 3D</h1>
<p>Siga o bonde pela frente da estação e acompanhe seu retorno pelo trilho ao fundo.</p>
<div id="stage"><p id="fallback" role="status">Carregando a cena 3D…</p></div>
<nav aria-label="Controles da cena"><button id="play" disabled>Pausar</button><button id="reset" disabled>Recomeçar</button><button id="slow" aria-pressed="false" disabled>Câmera lenta</button><button id="view" aria-pressed="false" disabled>Vista elevada</button></nav>
<p id="phase"></p>
</main>
<script type="module">
const get = id => document.getElementById(id);
try {
const T = await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');
const stage = get('stage');
const renderer = new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.setClearColor(0xeaf0f5);
stage.append(renderer.domElement);
const scene = new T.Scene();
scene.fog = new T.Fog(0xeaf0f5,33,92);
scene.add(new T.HemisphereLight(0xf3f8ff,0x8a99ac,2.1));
const sun = new T.DirectionalLight(0xffefd6,2.5);
sun.position.set(-8,15,12);
scene.add(sun);
const camera = new T.PerspectiveCamera(34,2.2,.1,145);
const materials = new Map();
function material(color) {
  if (!materials.has(color)) materials.set(color,new T.MeshStandardMaterial({color,roughness:.72}));
  return materials.get(color);
}
function mesh(parent, geometry, color, x,y,z) {
  const object = new T.Mesh(geometry,material(color));
  object.position.set(x,y,z);
  parent.add(object);
  return object;
}
const box=(parent,color,x,y,z,w,h,d)=>mesh(parent,new T.BoxGeometry(w,h,d),color,x,y,z);
function beam(parent,a,b,w,color) {
  const from=new T.Vector3(...a),to=new T.Vector3(...b);
  const center=from.clone().lerp(to,.5);
  const piece=box(parent,color,...center.toArray(),w,from.distanceTo(to),w);
  piece.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),to.sub(from).normalize());
}
const model = new T.Group();
scene.add(model);
box(model,0xa4b9cf,0,-.15,0,100,.28,64);
for(let i=0;i<29;i++){
  const x=(i-14)*2.65, h=1.5+((i*13)%11)*.44;
  const z=-16-(i%3)*1.5;
  box(model,i%2 ? 0x8ea4b8 : 0x9aafc2,x,h/2,z,1.4+i%4*.25,h,1.6);
  if(i%4===0) box(model,0x839aae,x,h+.32,z,.12,.65,.12);
}
const station = new T.Group();
model.add(station);
station.position.set(0,0,-1.5);
box(station,0x8e9eab,0,.12,0,13.4,.24,4.5);
box(station,0x768da2,0,1.55,0,11.8,2.85,3.55);
function roof(width,depth,y,rise){
  const shape=new T.Shape();
  shape.moveTo(-depth/2,0);shape.lineTo(0,rise);shape.lineTo(depth/2,0);shape.closePath();
  const geometry=new T.ExtrudeGeometry(shape,{depth:width,bevelEnabled:false});
  geometry.rotateY(Math.PI/2);
  mesh(station,geometry,0x586e82,-width/2,y,0);
}
roof(12.8,4.6,2.98,1.05);
box(station,0x8499aa,0,3.9,.12,2.45,3,2.5);
roof(3.4,3.05,5.45,.8);
function disk(parent,color,x,y,z,r,depth){
  const item=mesh(parent,new T.CylinderGeometry(r,r,depth,32),color,x,y,z);
  item.rotation.x=Math.PI/2;
  return item;
}
for(const x of [-4.1,-1.38,1.38,4.1]){
  for(const side of [-1,1]){
    disk(station,0x4d6679,x,1.48,side*1.79,.68,.06);
    box(station,0x4d6679,x,.94,side*1.79,1.36,1.12,.07);
    disk(station,0x2e485b,x,1.46,side*1.84,.50,.06);
    box(station,0x2e485b,x,.94,side*1.84,1,1.05,.06);
  }
}
disk(station,0x25404c,0,4.39,1.42,.76,.14);
disk(station,0xffecc4,0,4.39,1.51,.64,.04);
for(let i=0;i<12;i++){
  const a=i*Math.PI/6;
  const tick=box(station,0x5c5647,Math.sin(a)*.54,4.39+Math.cos(a)*.54,1.54,.037,.12,.025);
  tick.rotation.z=-a;
}
beam(station,[0,4.39,1.56],[.24,4.53,1.56],.062,0x383833);
beam(station,[0,4.39,1.57],[.14,4.06,1.57],.044,0x383833);

const straight=22, radius=5.1, arc=Math.PI*radius, length=4*straight+2*arc;
function route(distance,lateral=0){
  let s=((distance%length)+length)%length;
  const r=radius+lateral;
  if(s<2*straight)return [-straight+s,r];
  s-=2*straight;
  if(s<arc){const a=s/radius;return [straight+r*Math.sin(a),r*Math.cos(a)];}
  s-=arc;
  if(s<2*straight)return [straight-s,-r];
  const a=(s-2*straight)/radius;
  return [-straight-r*Math.sin(a),-r*Math.cos(a)];
}
function branch(t){return [2.6+t*20,radius+8.8*t*t];}
function rail(points){
  const path=new T.CurvePath();
  for(let i=1;i<points.length;i++)path.add(new T.LineCurve3(points[i-1],points[i]));
  mesh(model,new T.TubeGeometry(path,points.length-1,.035,6,false),0x526471,0,0,0);
}
for(const offset of [-.46,.46]){
  rail(Array.from({length:241},(_,i)=>{
    const [x,z]=route(i*length/240,offset);
    return new T.Vector3(x,.12,z);
  }));
  rail(Array.from({length:31},(_,i)=>{
    const t=i/30;
    const [x,z]=branch(t);
    return new T.Vector3(x,.12,z+offset);
  }));
}
const sleeperGeo=new T.BoxGeometry(.19,.10,1.34);
const sleepers=new T.InstancedMesh(sleeperGeo,material(0x79543f),197);
const dummy=new T.Object3D();
for(let i=0;i<197;i++){
  if(i<178){
    const d=i*length/178,[x,z]=route(d),[nx,nz]=route(d+.05);
    dummy.position.set(x,.045,z);
    dummy.rotation.y=Math.atan2(z-nz,nx-x);
  }else{
    const t=(i-178+9)/27;
    const [x,z]=branch(t);
    dummy.position.set(x,.045,z);
    dummy.rotation.y=-Math.atan(17.6*t/20);
  }
  dummy.updateMatrix();sleepers.setMatrixAt(i,dummy.matrix);
}
model.add(sleepers);

const car=new T.Group();
model.add(car);
box(car,0xb91c20,0,1.02,0,5.05,1.43,1.52);
box(car,0xe53830,0,.72,0,5.07,.55,1.54);
box(car,0x1d4679,0,1.04,0,5.1,.15,1.56);
box(car,0x2d3942,0,1.78,0,5.16,.17,1.64);
for(const side of [-1,1]){
  for(const x of [-1.95,-1.13,-.37,.37,1.13,1.95]){
    box(car,0x182d43,x,1.41,side*.77,.66,.56,.05);
    box(car,0x388bd1,x,1.41,side*.81,.55,.45,.035);
    beam(car,[x-.17,1.24,side*.836],[x+.02,1.61,side*.836],.028,0x86c9ea);
  }
}
for(const end of [-1,1]){
  box(car,0x244e78,end*2.54,1.41,0,.05,.5,1.15);
  box(car,end===1?0xffe5a7:0xb51c20,end*2.57,.87,0,.08,.19,.24);
  box(car,0x333d46,end*2.62,.43,0,.19,.16,1.64);
}
const wheels=[];
for(const x of [-1.77,-1.03,1.03,1.77]){
  for(const side of [-1,1]){
    const wheel=new T.Group();
    wheel.position.set(x,.34,side*.62);car.add(wheel);wheels.push(wheel);
    disk(wheel,0x222830,0,0,0,.27,.19);
    disk(wheel,0x9aabb8,0,0,side*.11,.15,.027);
    box(wheel,0x344452,.045,0,side*.129,.06,.045,.025);
  }
}
const pantograph=[[-.72,1.88,0],[0,2.25,0],[.63,2.65,0],[0,2.74,0],[-.66,2.54,0],[0,2.25,0],[.71,1.88,0]];
for(let i=1;i<pantograph.length;i++)beam(car,pantograph[i-1],pantograph[i],.049,0x892b2a);
beam(car,[-.36,2.75,0],[.36,2.75,0],.045,0x323c46);

function person(x,z,coat){
  const g=new T.Group();
  g.position.set(x,0,z);model.add(g);
  for(const sign of [-1,1]){
    box(g,0x423831,sign*.11,.32,0,.15,.59,.17);
    box(g,0x302b28,sign*.11,.08,.04,.17,.11,.25);
    box(g,coat,sign*.24,.92,.02,.13,.46,.17);
  }
  box(g,coat,0,.95,0,.39,.63,.25);
  mesh(g,new T.SphereGeometry(.137,12,8),0xc59774,0,1.42,0);
  box(g,0x614d3b,0,1.53,0,.34,.065,.28);
}
for(const x of [7.2,9.1,11])person(x,radius+.08,0x9b7955);
const [singleX,singleZ]=branch(.45);
person(singleX,singleZ,0xe1e6e7);
person(-1.6,7.1,0x2e6392);
beam(model,[.72,.14,7.15],[.35,.95,7.15],.08,0x5e7189);
mesh(model,new T.SphereGeometry(.16,16,10),0xc8242d,.35,.95,7.15);
function marker(label,x,y,z){
  const canvas=document.createElement('canvas');canvas.width=64;canvas.height=64;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#25384b';ctx.font='bold 50px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,32,32);
  const sprite=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(canvas),depthWrite:false}));
  sprite.position.set(x,y,z);sprite.scale.set(.8,.8,.8);model.add(sprite);
}
marker('3',9.1,2.03,radius+.18);
marker('1',singleX,1.98,singleZ+.06);

let elevated=false, playing=!matchMedia('(prefers-reduced-motion: reduce)').matches, rate=1, distance=9, last;
function resize(){
  const w=stage.clientWidth,h=stage.clientHeight;
  if(!w||!h)return;
  camera.aspect=w/h;
  camera.position.set(0,elevated?32:7.2,elevated?31:Math.max(25,53/camera.aspect));
  camera.lookAt(0,elevated?1.9:3.65,0);camera.updateProjectionMatrix();renderer.setSize(w,h,false);
}
new ResizeObserver(resize).observe(stage);
resize();
function frame(now){
  if(playing&&last!==undefined) distance=(distance+Math.min((now-last)/1000,.05)*5.7*rate)%length;
  last=now;
  const [x,z]=route(distance),[nx,nz]=route(distance+.03);
  car.position.set(x,.04,z);car.rotation.y=Math.atan2(z-nz,nx-x);
  for(const wheel of wheels)wheel.rotation.z=-distance/.27;
  const label=distance<2*straight?'Primeiro plano · saída pela direita':distance<2*straight+arc?'Curva · fora do enquadramento':distance<4*straight+arc?'Trilho ao fundo · passagem atrás da estação':'Curva · retorno ao primeiro plano';
  if(get('phase').textContent!==label)get('phase').textContent=label;
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
function syncPlay(){get('play').textContent=playing?'Pausar':'Reproduzir';}
get('play').onclick=()=>{playing=!playing;syncPlay();};
get('reset').onclick=()=>{distance=9;};
get('slow').onclick=()=>{rate=rate===1?.5:1;get('slow').setAttribute('aria-pressed',String(rate===.5));};
get('view').onclick=()=>{elevated=!elevated;get('view').setAttribute('aria-pressed',String(elevated));resize();};
syncPlay();
for(const button of document.querySelectorAll('button'))button.disabled=false;
get('fallback').remove();
frame(performance.now());
} catch(error) {
  get('fallback').textContent='Não foi possível abrir a cena. Confira a conexão e o suporte a WebGL no navegador.';
  console.error(error);
}
</script>
</html>
