<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0f14">
<title>O museu · Loop</title>
<style>
:root{--ouro:#efc878;--papel:#f4efe3;--fundo:#0b0f14}
*{box-sizing:border-box}
html,body{margin:0;height:100%;height:100dvh;background:var(--fundo);color:var(--papel);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
#topo{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#titulo{font:700 17px/1.2 system-ui;text-shadow:0 2px 10px #000}
#titulo small{display:block;margin-top:3px;font:600 11px/1.3 system-ui;letter-spacing:.14em;text-transform:uppercase;color:var(--ouro)}
button,a.bt{pointer-events:auto;font:700 14px system-ui;color:var(--papel);border:1px solid #5b6b78;background:linear-gradient(#1c2a36,#121b24);border-radius:12px;min-height:44px;padding:0 14px;box-shadow:0 4px 0 #080d12;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #080d12}
button.ouro{background:linear-gradient(#f3d078,#d9a93a);color:#201707;border:0;box-shadow:0 4px 0 #6f4d17}
button.on{border-color:var(--ouro);color:var(--ouro)}
#baixo{display:grid;gap:8px}
#andares{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#andares button{min-width:56px}
#salas{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:560px;width:100%;margin:0 auto}
#salas button{font-size:12.5px;line-height:1.2;padding:6px;min-height:46px}
#salas:empty{display:none}
#ajuda{text-align:center;font:500 13px/1.4 system-ui;color:#d9d2c0;text-shadow:0 1px 6px #000;transition:opacity .5s}
#cartao{pointer-events:auto;max-width:560px;width:100%;margin:0 auto;padding:12px 14px;border:1px solid #75664e;border-left:5px solid #9a7842;border-radius:12px;background:linear-gradient(160deg,#e7dfca,#b9aa8d);color:#211d17;display:none}
#cartao b{display:block;font:800 19px/1.2 system-ui}
#cartao span{display:block;margin-top:2px;font:600 12px/1.3 system-ui;letter-spacing:.08em;text-transform:uppercase;color:#6b5a38}
#cartao p{margin:6px 0 10px;font-size:14.5px;line-height:1.45;color:#3a3226}
#carr{position:fixed;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;background:var(--fundo);font:600 14px system-ui;color:var(--ouro)}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="carr">Montando o museu…</div>
<div id="hud">
  <div id="topo"><div id="titulo">O museu<small>Toque num andar para abrir a gaveta</small></div>
    <div style="display:flex;gap:6px"><button id="bFach" type="button" class="on">Fachada</button><a class="bt" id="bSair" href="../">Sair</a></div></div>
  <div id="baixo">
    <div id="ajuda">Arraste para girar · pince para aproximar · toque num andar</div>
    <div id="cartao"><span id="cAndar"></span><b id="cNome"></b><p id="cTexto"></p><button id="bVoltar" type="button" class="ouro">Voltar ao museu</button></div>
    <div id="salas"></div>
    <div id="andares"></div>
  </div>
</div>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = id => document.getElementById(id);
const NOMES_ANDAR = ['Térreo', '1º andar', '2º andar', '3º andar', '4º andar'];
const SALAS = await (await fetch('salas.json')).json();

const R = new THREE.WebGLRenderer({canvas: $('c'), antialias: true});
R.setPixelRatio(Math.min(devicePixelRatio, 2)); R.outputColorSpace = THREE.SRGBColorSpace;
R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = .9;
const S = new THREE.Scene(); S.background = new THREE.Color(0x0e1319);
S.environment = new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(), 0.04).texture;
S.add(new THREE.HemisphereLight(0xdfe8f5, 0x3a3228, .55));
const sol = new THREE.DirectionalLight(0xfff0d8, 1.4); sol.position.set(.6, 1.2, 1); S.add(sol);
const cam = new THREE.PerspectiveCamera(42, 1, .01, 20);
const OC = new OrbitControls(cam, $('c')); OC.enableDamping = true; OC.dampingFactor = .08; OC.minDistance = .12; OC.maxDistance = 2.2; OC.maxPolarAngle = Math.PI * .52;
const VISTA = {pos: new THREE.Vector3(.65, .42, .95), alvo: new THREE.Vector3(-.08, .22, .02)};
cam.position.copy(VISTA.pos); OC.target.copy(VISTA.alvo);
const chao = new THREE.Mesh(new THREE.CircleGeometry(1.6, 64), new THREE.MeshStandardMaterial({color: 0x1b222b, roughness: 1})); chao.rotation.x = -Math.PI / 2; chao.position.y = -.002; S.add(chao);

const dr = new DRACOLoader(); dr.setDecoderPath('./vendor/draco/');
const gl = new GLTFLoader(); gl.setDRACOLoader(dr);
const andar = [], pos0 = [], alvoZ = [0, 0, 0, 0, 0], atualZ = [0, 0, 0, 0, 0];
let torre = null, fachadaOn = true, aberto = -1, dentro = null;
const SLIDE = 11;                                     // metros do prédio (a torre tem escala 0,025)

gl.load('torre.glb?v=20261123c', g => {
  torre = g.scene; S.add(torre);
  for (let k = 0; k < 5; k++) { andar[k] = torre.getObjectByName('andar_' + k); pos0[k] = andar[k].position.z; }
  montaAndares(); $('carr').style.display = 'none';
}, undefined, e => { $('carr').textContent = 'Não consegui abrir o museu.'; console.error(e); });

function nomeSala(no) { return SALAS[no.name.replace('sala_', '')] || {nome: no.name, sub: '', texto: ''}; }
function salasDoAndar(k) { return andar[k].children.filter(n => n.name.startsWith('sala_')); }
function fachadas(k) { return andar[k].children.filter(n => n.name.startsWith('fachada_')); }
function aplicaFachada() { for (let k = 0; k < 5; k++) fachadas(k).forEach(n => n.visible = fachadaOn && k !== aberto && dentro === null); }

function montaAndares() {
  const box = $('andares'); box.innerHTML = '';
  for (let k = 4; k >= 0; k--) { const b = document.createElement('button'); b.type = 'button'; b.textContent = NOMES_ANDAR[k]; b.dataset.k = k; b.onclick = () => abre(aberto === k ? -1 : k); box.appendChild(b); }
}
function abre(k) {
  if (dentro) sai(true);
  aberto = k; for (let i = 0; i < 5; i++) alvoZ[i] = i === k ? SLIDE : 0;
  document.querySelectorAll('#andares button').forEach(b => b.classList.toggle('on', +b.dataset.k === k));
  const cx = $('salas'); cx.innerHTML = '';
  if (k >= 0) {
    salasDoAndar(k).forEach(n => { const s = nomeSala(n); const b = document.createElement('button'); b.type = 'button'; b.textContent = s.nome; b.onclick = () => entra(n, k); cx.appendChild(b); });
    $('titulo').querySelector('small').textContent = NOMES_ANDAR[k] + ' aberto · escolha uma sala';
    voaPara(new THREE.Vector3(.5, .32 + k * .0, .8).add(new THREE.Vector3(0, .1 * k, 0)), worldPos(andar[k], SLIDE).add(new THREE.Vector3(0, 0, 0)), 900);
  } else { $('titulo').querySelector('small').textContent = 'Toque num andar para abrir a gaveta'; voaPara(VISTA.pos, VISTA.alvo, 800); }
  aplicaFachada();
}
function worldPos(no, dz) { const p = new THREE.Vector3(); const c = new THREE.Box3().setFromObject(no).getCenter(p); return new THREE.Vector3(c.x, c.y, c.z + dz * .025); }
function entra(no, k) {
  dentro = no; const s = nomeSala(no);
  const centro = new THREE.Box3().setFromObject(no).getCenter(new THREE.Vector3());
  voaPara(new THREE.Vector3(centro.x + .11, centro.y + .17, centro.z + .3), new THREE.Vector3(centro.x, centro.y - .01, centro.z), 900);
  for (let i = 0; i < 5; i++) andar[i].visible = i === k; aplicaFachada();
  $('cAndar').textContent = NOMES_ANDAR[k]; $('cNome').textContent = s.nome; $('cTexto').textContent = s.texto || s.sub;
  $('cartao').style.display = 'block'; $('salas').style.display = 'none'; $('andares').style.display = 'none'; $('ajuda').style.opacity = 0;
}
function sai(rapido) {
  dentro = null; for (let i = 0; i < 5; i++) andar[i].visible = true;
  $('cartao').style.display = 'none'; $('salas').style.display = ''; $('andares').style.display = ''; aplicaFachada();
  if (!rapido && aberto >= 0) abre(aberto);
}
$('bVoltar').onclick = () => { const k = aberto; sai(true); abre(-1); void k; };
$('bFach').onclick = () => { fachadaOn = !fachadaOn; $('bFach').classList.toggle('on', fachadaOn); aplicaFachada(); };

// câmera: voo suave
let voo = null;
function voaPara(p, alvo, ms) { voo = {p0: cam.position.clone(), a0: OC.target.clone(), p1: p.clone(), a1: alvo.clone(), t0: performance.now(), ms}; }
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

// toque: gaveta
const ray = new THREE.Raycaster(), m2 = new THREE.Vector2(); let d0 = null;
$('c').addEventListener('pointerdown', e => d0 = {x: e.clientX, y: e.clientY, t: performance.now()});
$('c').addEventListener('pointerup', e => {
  if (!d0 || !torre) return; const mov = Math.hypot(e.clientX - d0.x, e.clientY - d0.y), dt = performance.now() - d0.t; d0 = null;
  if (mov > 8 || dt > 500 || dentro) return;
  m2.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(m2, cam);
  const hit = ray.intersectObjects(torre.children, true)[0]; if (!hit) return;
  let n = hit.object, sala = null, k = -1;
  while (n) { if (n.name.startsWith('sala_')) sala = n; const i = andar.indexOf(n); if (i >= 0) { k = i; break; } n = n.parent; }
  if (k < 0) return;
  if (sala && k === aberto) entra(sala, k); else abre(aberto === k ? -1 : k);
});

function tam() { R.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', tam); tam();
R.setAnimationLoop(t => {
  for (let k = 0; k < 5; k++) if (andar[k]) { atualZ[k] += (alvoZ[k] - atualZ[k]) * .12; andar[k].position.z = pos0[k] + atualZ[k]; }
  if (voo) { const u = Math.min(1, (performance.now() - voo.t0) / voo.ms), e = ease(u); cam.position.lerpVectors(voo.p0, voo.p1, e); OC.target.lerpVectors(voo.a0, voo.a1, e); if (u >= 1) voo = null; }
  OC.update(); R.render(S, cam);
});
setTimeout(() => $('ajuda').style.opacity = 0, 12000);
window.__t = {cam, OC, abre, entra: (id) => { const n = torre.getObjectByName('sala_' + id); let k = andar.findIndex(a => a.children.includes(n)); abre(k); setTimeout(() => entra(n, k), 50); }, sai, get aberto() { return aberto; }};
</script></body></html>
