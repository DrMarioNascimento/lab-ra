<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Isolar uma peça do B</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0a0d0a; color: #dbe6d8;
         font: 14px/1.55 "IBM Plex Mono", ui-monospace, monospace; }
  h1 { font-size: 15px; letter-spacing: .16em; text-transform: uppercase;
       color: #9ec49a; margin: 16px 20px 10px; font-weight: 600; }
  .caixa { display: grid; grid-template-columns: 1fr 330px; gap: 16px; padding: 0 16px 20px; }
  @media (max-width: 900px) { .caixa { grid-template-columns: 1fr; } }
  #palco { width: 100%; height: 660px; display: block;
           border: 1px solid #24331f; border-radius: 12px; background: #10150f; }
  .painel { border: 1px solid #24331f; border-radius: 12px; background: #10150f; padding: 14px 16px; }
  label { display: block; margin: 12px 0 5px; color: #9ec49a; font-size: 12px;
          letter-spacing: .1em; text-transform: uppercase; }
  select, button { width: 100%; background: #1c2718; color: #e8f2e4; border: 1px solid #35492c;
                   border-radius: 8px; padding: 7px 10px; font: inherit; }
  button { cursor: pointer; margin-top: 8px; }
  button:hover { background: #26351f; }
  .linhas { margin-top: 14px; border-top: 1px solid #24331f; padding-top: 10px; font-size: 12.5px; }
  .linhas div { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
  .linhas b { color: #f2f7ec; }
</style>
</head>
<body>
<h1>Isolar uma peça do B</h1>
<div class="caixa">
  <canvas id="palco"></canvas>
  <div class="painel">
    <label>Peça em destaque</label>
    <select id="peca"></select>
    <button id="fantasma" type="button">Esconder o resto</button>
    <div class="linhas">
      <div><span>triângulos</span><b id="ltri">—</b></div>
      <div><span>altura</span><b id="lalt">—</b></div>
      <div><span>largura × espessura</span><b id="llar">—</b></div>
      <div><span>y de … a</span><b id="ly">—</b></div>
      <div><span>fração da altura total</span><b id="lfr">—</b></div>
    </div>
  </div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ── ONDE MORAM OS MODELOS ──────────────────────────────────────────────
   O B é o EXPORT DA ESTEIRA, versionado neste repositório — a mesma peça de
   79 malhas que os testes travam. Antes estas páginas pediam
   `modelos/B-bodyparts3d.glb`, um diretório que só existia na máquina de
   quem escreveu: commitadas, elas nasceram quebradas e ninguém percebeu,
   porque quem abria já tinha o arquivo ao lado.

   Esta página não usa o scan de referência: só a peça da esteira. */
const MODELO_B = '../export/coracao-bancada11-WIP.glb';

const $ = id => document.getElementById(id);
const canvas = $('palco');
const r = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
r.setPixelRatio(Math.min(devicePixelRatio, 2));
r.outputColorSpace = THREE.SRGBColorSpace;
r.toneMapping = THREE.ACESFilmicToneMapping;
r.toneMappingExposure = 1.1;
const cena = new THREE.Scene();
cena.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), .04).texture;
cena.environmentIntensity = .75;
cena.add(new THREE.HemisphereLight(0xffeede, 0x181016, 1.0));
const key = new THREE.DirectionalLight(0xfff2e6, 2.4); key.position.set(120, 180, 160); cena.add(key);
const fill = new THREE.DirectionalLight(0xffcfc4, .6); fill.position.set(-140, 60, 100); cena.add(fill);
const rim = new THREE.DirectionalLight(0x9fb8ff, 1.0); rim.position.set(-80, 90, -180); cena.add(rim);
const cam = new THREE.PerspectiveCamera(32, 1, .1, 5000);
const ctl = new OrbitControls(cam, canvas); ctl.enableDamping = true;
function medir() { const w = canvas.clientWidth, h = canvas.clientHeight;
  r.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
addEventListener('resize', medir); medir();

/* `flatShading: true` é OBRIGATÓRIO aqui. O GLB não tem atributo NORMAL —
   só POSITION —, e o GLTFLoader compensa marcando flatShading nos materiais
   que ele mesmo cria. Ao substituir o material eu perdia essa marca, e a
   peça isolada renderizava PRETA: sem normal e sem flatShading, o PBR não
   tem como iluminar. É também por isso que o B inteiro parece facetado.

   DUAS FACES neste visualizador de diagnóstico. Várias malhas do BodyParts3D
   têm as normais para dentro — isoladas, apareciam pretas, porque só se via a
   face de trás. Aqui isso não custa nada: é página de inspeção, não vai para
   glTF nem para USDZ, onde `side` seria descartado. */
const destaque = new THREE.MeshPhysicalMaterial({ color: 0xff6a4d, roughness: .45, sheen: .6,
  emissive: 0x3a0e06, emissiveIntensity: .5, side: THREE.DoubleSide, flatShading: true });
const apagado = new THREE.MeshPhysicalMaterial({ color: 0x9fb0a0, roughness: .8,
  transparent: true, opacity: .10, depthWrite: false, side: THREE.DoubleSide, flatShading: true });

let malhas = [], alturaTotal = 1, escondido = false;

new GLTFLoader().load(MODELO_B, g => {
  g.scene.updateMatrixWorld(true);
  g.scene.traverse(o => { if (o.isMesh) { o.userData.matOriginal = o.material; malhas.push(o); } });
  const caixa = new THREE.Box3().setFromObject(g.scene);
  const tam = caixa.getSize(new THREE.Vector3()), cen = caixa.getCenter(new THREE.Vector3());
  alturaTotal = tam.y;
  g.scene.position.sub(cen);
  cena.add(g.scene);
  const d = Math.max(tam.x, tam.y, tam.z) / Math.tan(cam.fov * Math.PI / 360) * 1.15;
  cam.position.set(d * .20, d * .10, d * .95);
  ctl.target.set(0, 0, 0); ctl.update();

  const sel = $('peca');
  /* a peça inteira, com os materiais do próprio arquivo */
  const tudo = document.createElement('option');
  tudo.value = '*'; tudo.textContent = '— a peça inteira —';
  sel.appendChild(tudo);
  malhas.slice().sort((a, b) => (a.name || '').localeCompare(b.name || ''))
    .forEach(m => { const o = document.createElement('option');
      o.value = m.name; o.textContent = m.name; sel.appendChild(o); });
  sel.value = '*';
  sel.addEventListener('change', pintar);
  pintar();
  medir(); r.render(cena, cam);
});

function pintar() {
  const alvo = $('peca').value;
  const inteira = alvo === '*';
  let tri = 0, caixa = new THREE.Box3();
  for (const m of malhas) {
    const eu = inteira || m.name === alvo;
    m.material = inteira ? m.userData.matOriginal : (eu ? destaque : apagado);
    m.visible = eu || !escondido;
    if (eu) {
      const g = m.geometry;
      tri += (g.index ? g.index.count : g.attributes.position.count) / 3;
      caixa.expandByObject(m);
    }
  }
  const t = caixa.getSize(new THREE.Vector3());
  $('ltri').textContent = Math.round(tri).toLocaleString('pt-BR');
  $('lalt').textContent = t.y.toFixed(0) + ' mm';
  $('llar').textContent = t.x.toFixed(0) + ' × ' + t.z.toFixed(0) + ' mm';
  $('ly').textContent = caixa.min.y.toFixed(0) + ' a ' + caixa.max.y.toFixed(0);
  $('lfr').textContent = (t.y / alturaTotal * 100).toFixed(0) + '%';
  r.render(cena, cam);
}

$('fantasma').onclick = e => {
  escondido = !escondido;
  e.currentTarget.textContent = escondido ? 'Mostrar o resto' : 'Esconder o resto';
  pintar();
};

r.setAnimationLoop(() => { ctl.update(); r.render(cena, cam); });
</script>
</body>
</html>
